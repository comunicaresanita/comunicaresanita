name: Migrazione 1 - Ispeziona l'esportazione (solo struttura)

# Scarica l'esportazione del database da un link temporaneo e stampa SOLO la sua struttura
# (formato, versione, schemi, nomi delle tabelle). Non stampa mai righe di dati: il repository è pubblico.
# Segreto richiesto: DUMP_URL (link temporaneo al file dell'esportazione).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ispeziona:
    runs-on: ubuntu-latest
    steps:
      - name: Installa gli strumenti PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release zstd
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_restore --version

      - name: Scarica l'esportazione
        env:
          DUMP_URL: ${{ secrets.DUMP_URL }}
        run: |
          echo "::add-mask::$DUMP_URL"
          curl -fL --retry 3 --silent --show-error -o dump.bin "$DUMP_URL"
          ls -l dump.bin | awk '{print "Dimensione (byte): " $5}'

      - name: Struttura (nessun dato)
        run: |
          echo "Intestazione del file: $(head -c 5 dump.bin | tr -d '\0')"
          file dump.bin | cut -c1-200
          if [ "$(head -c 5 dump.bin)" = "PGDMP" ]; then
            echo "== Formato: archivio PostgreSQL (pg_restore)"
            pg_restore -l dump.bin > toc.txt
            echo "== Intestazione"
            sed -n '1,25p' toc.txt
            echo "== Schemi"
            grep -E ' SCHEMA - ' toc.txt | sed 's/^[0-9; ]*//' | cut -c1-100
            echo "== Estensioni"
            grep -E ' EXTENSION - ' toc.txt | sed 's/^[0-9; ]*//' | cut -c1-100
            echo "== Tabelle con dati (nome tabella)"
            grep -E ' TABLE DATA ' toc.txt | sed 's/^[0-9; ]*//' | cut -c1-100
            echo "== Conteggio per tipo di oggetto"
            awk '!/^;/ && NF>3 {print $4" "$5}' toc.txt | sort | uniq -c | sort -rn | head -30
          else
            echo "== Formato: testo SQL (psql)"
            echo "Righe totali: $(wc -l < dump.bin)"
            echo "== Schemi e tabelle (solo intestazioni, nessun dato)"
            grep -E '^(CREATE SCHEMA|CREATE EXTENSION|CREATE TABLE|COPY )' dump.bin | sed -E 's/ FROM stdin;?$//' | cut -c1-140 | head -150
          fi
