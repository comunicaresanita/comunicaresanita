name: Migrazione 4 - Foto profilo, indirizzi delle foto e cron

# Dopo il ripristino (procedura 2): copia le foto profilo dal vecchio progetto al nuovo, riscrive gli indirizzi
# delle foto nei profili e crea i due lavori orari (promemoria e scadenza richieste).
# Segreti richiesti: DUMP_URL, SUPABASE_DB_URL, SUPABASE_SERVICE_ROLE_KEY (chiave "secret" del NUOVO progetto), CRON_SECRET.
# Prima: nel nuovo Supabase deve esistere il bucket pubblico "profile-photos".

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: Scrivi PROSEGUI per confermare
        required: true

permissions:
  contents: read

env:
  PROGETTO_ATTESO: ywcansmtvmdvabnecova

jobs:
  foto-e-cron:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DUMP_URL: ${{ secrets.DUMP_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlli di sicurezza
        run: |
          if [ "${{ inputs.conferma }}" != "PROSEGUI" ]; then echo "Conferma mancante: scrivi PROSEGUI."; exit 1; fi
          for v in SUPABASE_DB_URL DUMP_URL SUPABASE_SERVICE_ROLE_KEY CRON_SECRET; do
            if [ -z "${!v}" ]; then echo "Manca il segreto $v."; exit 1; fi
          done
          case "$SUPABASE_DB_URL" in *"$PROGETTO_ATTESO"*) ;; *) echo "STOP: il database non e' quello del nuovo progetto."; exit 1 ;; esac

      - name: Installa gli strumenti PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Scarica l'esportazione
        run: |
          echo "::add-mask::$DUMP_URL"
          echo "::add-mask::$CRON_SECRET"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          curl -fL --retry 3 --silent --show-error -o dump.bin "$DUMP_URL"

      - name: Copia le foto profilo
        run: |
          pg_restore -l dump.bin | grep -E ' TABLE DATA storage objects ' > objects.list
          pg_restore --data-only -L objects.list -f storage_objects.sql dump.bin
          python3 docs/migrazione/copia_foto.py

      - name: Riscrivi gli indirizzi delle foto nei profili
        run: |
          sed "s/__REF__/$PROGETTO_ATTESO/g" docs/migrazione/05-foto-profilo.sql | psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At

      - name: Crea i lavori orari (cron)
        run: |
          python3 docs/migrazione/applica_cron.py
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -f cron_pronto.sql | cut -c1-120
          rm -f cron_pronto.sql
